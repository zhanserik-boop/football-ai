name: Understat Top5 10Y Export

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/research/download_understat_top5_10y.py'
      - '.github/workflows/understat-top5-10y.yml'

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install underdata pandas requests beautifulsoup4
      - name: Download Understat Top-5 2016-2026
        run: python tools/research/download_understat_top5_10y.py
      - name: Validate file
        run: |
          python - <<'PY'
          import csv
          p='data/research/understat_top5_2016_2026_team_match.csv'
          with open(p,encoding='utf-8-sig') as f: rows=list(csv.DictReader(f))
          print('rows=',len(rows))
          print('leagues=',sorted(set(r['league'] for r in rows)))
          print('seasons=',len(set(r['season'] for r in rows)))
          for r in rows[:5]:
              print(r['league'],r['season'],r['team'],r['date'],'xG',r['xg'],'npxG',r['npxg'],'xPTS',r['xpts'])
          assert len(rows) > 10000
          assert len(set(r['league'] for r in rows)) == 5
          assert len(set(r['season'] for r in rows)) == 10
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: understat-top5-2016-2026
          path: data/research/understat_top5_2016_2026_team_match.csv
          if-no-files-found: error
